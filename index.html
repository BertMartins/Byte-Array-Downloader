<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byte Array Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#5D5CDE',
                    }
                }
            }
        }

        // Detectar modo escuro
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
    </script>
</head>

<body class="min-h-screen bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">
    <div class="container max-w-4xl mx-auto p-4">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-primary mb-2">Byte Array Downloader</h1>
            <p class="text-gray-600 dark:text-gray-400">Converta arrays de bytes em arquivos para download com a
                extensão correta</p>
        </header>

        <main class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
            <div class="mb-6">
                <h2 class="text-xl font-semibold mb-3">Entrada de Dados</h2>
                <div class="flex mb-4">
                    <div class="flex-1">
                        <label class="block text-sm font-medium mb-2" for="input-type">Formato de entrada:</label>
                        <select id="input-type"
                            class="w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-base py-2 px-3">
                            <option value="byte-array">Array de bytes (Decimal)</option>
                            <option value="hex-array">Array hexadecimal</option>
                            <option value="base64">Base64</option>
                            <option value="file">Arquivo</option>
                        </select>
                    </div>
                    <div class="ml-4">
                        <label class="block text-sm font-medium mb-2" for="filename">Nome do arquivo:</label>
                        <input type="text" id="filename"
                            class="w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-base py-2 px-3"
                            placeholder="arquivo" value="arquivo">
                    </div>
                </div>

                <div id="text-input-container">
                    <label class="block text-sm font-medium mb-2" for="byte-input">Insira os dados (array de
                        bytes):</label>
                    <textarea id="byte-input"
                        class="w-full h-40 rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-base p-3 font-mono"
                        placeholder="[37, 80, 68, 70, ...]"></textarea>
                </div>

                <div id="file-input-container" class="hidden">
                    <label class="block text-sm font-medium mb-2" for="file-input">Selecione um arquivo:</label>
                    <input type="file" id="file-input"
                        class="w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-base py-2 px-3">
                </div>
            </div>

            <div class="flex justify-center mb-6">
                <button id="process-btn"
                    class="bg-primary hover:bg-primary/90 text-white px-6 py-3 rounded-md font-medium shadow-sm transition">
                    Processar e Detectar Tipo
                </button>
            </div>

            <div id="result-container" class="hidden bg-gray-100 dark:bg-gray-700 rounded-lg p-4">
                <h2 class="text-xl font-semibold mb-3">Resultado</h2>
                <div class="mb-4">
                    <p>Tipo de arquivo detectado: <span id="file-type" class="font-mono font-bold"></span></p>
                    <p>Tamanho: <span id="file-size" class="font-mono"></span></p>
                </div>
                <div class="flex justify-center">
                    <button id="download-btn"
                        class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-md font-medium shadow-sm transition">
                        <span class="flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20"
                                fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L10 12.586l2.293-2.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z"
                                    clip-rule="evenodd" />
                                <path fill-rule="evenodd"
                                    d="M10 3a1 1 0 011 1v9.586l2.293-2.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 111.414-1.414L9 13.586V4a1 1 0 011-1z"
                                    clip-rule="evenodd" />
                            </svg>
                            Baixar Arquivo
                        </span>
                    </button>
                </div>
            </div>

            <div id="loading-container" class="hidden text-center py-4">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-primary"></div>
                <p class="mt-2">Processando dados...</p>
            </div>

            <div id="error-container"
                class="hidden bg-red-100 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-800 dark:text-red-300 rounded-lg p-4 mt-4">
                <p id="error-message"></p>
            </div>
        </main>

        <footer class="mt-8 text-center text-gray-600 dark:text-gray-400 text-sm">
            <p>Desenvolvido para converter arrays de bytes em arquivos para download</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
